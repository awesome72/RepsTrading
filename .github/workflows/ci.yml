name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Vercel builds on push but only runs `next build` (type-check + lint) — it never runs vitest.
# This workflow is the only thing that actually runs the test suite before code reaches main.
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so module-level env reads don't blow up during build.
      # Real secrets live in Vercel; this job never talks to a real Supabase project.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # `next build` does the type-check (next-env.d.ts references .next/types/routes.d.ts,
      # which only exists after a build/dev run — a standalone `tsc --noEmit` fails on a
      # fresh checkout before that file is generated). This is also the same command Vercel
      # runs, so a failure here means the real deploy would fail too.
      - run: npm run build
