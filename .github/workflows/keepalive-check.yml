# Supabase가 멈추면(무료 플랜 자동 일시정지 등) 로그인·서버 기록이 전부 끊긴다.
# 2026-09-30에 실제로 멈췄는데 우연히 발견했다 — 이제는 매일 확인해서 실패하면 이슈를 연다.
# (이슈가 열리면 GitHub가 저장소 주인에게 메일을 보낸다.)
# Vercel Cron이 03:00 UTC에 /api/keepalive를 부르고, 이 확인은 그 한 시간 뒤에 돈다.
name: Supabase keep-alive check

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "확인할 주소 (실패 경로를 시험할 때만 바꾼다)"
        required: false
        default: "https://reps-trading.vercel.app/api/keepalive"

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive (3 tries, 1 min apart)
        id: ping
        env:
          URL: ${{ inputs.url || 'https://reps-trading.vercel.app/api/keepalive' }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o body.txt -w "%{http_code}" --max-time 30 "$URL" || echo 000)
            if [ "$code" = "200" ] && grep -q '"ok":true' body.txt; then
              echo "keep-alive ok (try $i)"
              exit 0
            fi
            echo "try $i failed: HTTP $code"
            [ "$i" -lt 3 ] && sleep 60
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 응답의 원인 분류(env/db/schema)를 이슈에 싣는다 — 값은 고정된 세 단어뿐이라 그대로 써도 안전하다
          reason=$(grep -o '"reason":"[a-z]*"' body.txt | head -1 | cut -d'"' -f4 || true)
          echo "reason=${reason:-none}" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Open an issue (once) on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.ping.outputs.code }}
          REASON: ${{ steps.ping.outputs.reason }}
          URL: ${{ inputs.url || 'https://reps-trading.vercel.app/api/keepalive' }}
        run: |
          title="Supabase keep-alive check failed"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Still failing on $(date -u +%F): HTTP $CODE (reason: $REASON) from $URL"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$(cat <<EOF
          매일 확인하는 \`$URL\` 가 세 번 연속 실패했습니다 (마지막 응답: HTTP $CODE, 원인 분류: **$REASON**).

          로그인·서버 기록이 끊겼을 수 있습니다. 원인 분류별 확인:
          - **db** — Supabase에 닿지 않거나 reps 테이블이 없음. https://supabase.com/dashboard 에서 프로젝트가 Paused 인지 확인 → Restore
          - **schema** — 코드가 기대하는 컬럼·테이블이 DB에 없음(DDL을 아직 안 돌림). Vercel 런타임 로그의 "[keepalive] schema mismatch" 줄에서 어느 항목인지 확인하고, supabase/migrations/ 폴더의 해당 SQL을 SQL 편집기에서 실행
          - **env** — Vercel 환경변수(NEXT_PUBLIC_SUPABASE_URL / _ANON_KEY)가 비었거나 형식이 틀림
          - **none** — 응답 자체가 없음(사이트 장애). Vercel 대시보드의 최근 배포·런타임 로그 확인

          복구 후 이 이슈를 닫으면 됩니다.

          (자동 생성: .github/workflows/keepalive-check.yml)
          EOF
          )"
